# Example compilation (profile) for mpv-photo-frame.
# Copy this to <name>.conf in this folder, then play it with:
#   ./slideshow.sh <name>
# List all compilations with:  ./slideshow.sh --list
#
# A compilation is layered on top of the shared ../slideshow.conf: anything you
# leave unset here falls back to ../slideshow.conf, then to the script's built-in
# default. You may override ANY SLIDESHOW_* variable (see ../slideshow.conf.example).

# Source folders for this compilation, one per line (required unless already
# set in ../slideshow.conf). Optionally add  | excl1,excl2  after a path to skip
# folders (subfolder names, relative sub-paths like 2020/raw, or globs like */raw):
SLIDESHOW_SOURCES="
  /home/you/Pictures/Holidays | private,raw
"

# Optional: override any other setting, e.g. a faster cadence for this one:
#SLIDESHOW_DELAY=6

# Leave SLIDESHOW_PLAYLIST unset: each compilation automatically gets its own
# cache at ~/.cache/slideshow-playlist-<name>.m3u. Only set it here if you want
# a custom cache path for THIS compilation.
