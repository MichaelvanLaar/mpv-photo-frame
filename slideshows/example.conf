# Example slideshow for mpv-photo-frame.
# Copy this to <name>.conf in this folder, then play it with:
#   ./slideshow.sh <name>
# List all slideshows with:  ./slideshow.sh --list
#
# A slideshow inherits app-wide settings from ../slideshow.conf; anything you
# leave unset here falls back to ../slideshow.conf, then to the script's built-in
# default. You may override ANY SLIDESHOW_* setting (see ../slideshow.conf.example).

# Source folders for this slideshow, one per line (required). Optionally add
# | excl1,excl2  after a path to skip folders (subfolder names, relative
# sub-paths like 2020/raw, or globs like */raw):
SLIDESHOW_SOURCES="
  /home/you/Pictures/Holidays | private,raw
"

# Optional: override any setting for this slideshow, e.g. a faster cadence:
#SLIDESHOW_DELAY=6

# Leave SLIDESHOW_PLAYLIST unset: each slideshow automatically gets its own
# playlist cache at ~/.cache/slideshow-playlist-<name>.m3u. Only set it here if
# you want a custom path for THIS slideshow.
